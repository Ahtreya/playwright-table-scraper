name: Compute Table Sums with Playwright

on:
  push:
    branches:
      - main
  workflow_dispatch:   # lets you run it manually

jobs:
  calculate-sum:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm ci

      - name: Install Playwright
        uses: microsoft/playwright-github-action@v1
        with:
          browsers: chromium

      - name: Run Playwright script (22f3002107@ds.study.iitm.ac.in)
        run: |
          node sum-tables.js
